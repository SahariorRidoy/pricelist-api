<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Price List API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f0f4ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 16px; padding: 40px; max-width: 480px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    h1 { font-size: 2rem; color: #1a73e8; margin-bottom: 8px; }
    .status { display: inline-block; background: #e6f4ea; color: #2e7d32; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f5f5f5; padding: 8px 12px; font-size: 13px; color: #555; }
    td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #eee; font-family: monospace; }
    .method { font-weight: bold; color: #1a73e8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Price List API</h1>
    <span class="status">✅ Running</span>
    <table>
      <tr><th>Method</th><th>Endpoint</th></tr>
      <tr><td class="method">GET</td><td>/api/products</td></tr>
      <tr><td class="method">POST</td><td>/api/products</td></tr>
      <tr><td class="method">PUT</td><td>/api/products/:id</td></tr>
      <tr><td class="method">DELETE</td><td>/api/products/:id</td></tr>
    </table>
  </div>
</body>
</html>
